name: GitHub Flow CI/CD Pipeline Variant 18

on:
  push:
    branches: [ "main" ]

jobs:
  local-deploy:
    runs-on: [self-hosted, Linux, wsl-art-runner]
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v3

      - name: Stop and remove obsolete container
        run: |
          docker stop bsuir-node-web-container-var18 || true
          docker rm bsuir-node-web-container-var18 || true

      - name: Build local Docker image
        run: docker build -t bsuir-node-image:latest .

      - name: Run updated Node Container on port 8888
        run: |
          docker run -d \
            --restart unless-stopped \
            --name bsuir-node-web-container-var18 \
            -p 8888:80 \
            bsuir-node-image:latest
